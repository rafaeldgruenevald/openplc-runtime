name: Build OpenPLC Runtime

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-runtime:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64,
            linux/arm64

          tags: |
            ghcr.io/rafaeldgruenevald/openplc-runtime:latest
            ghcr.io/rafaeldgruenevald/openplc-runtime:sha-${{ github.sha }}

          build-args: |
            RUNTIME_VERSION=4.0.0
